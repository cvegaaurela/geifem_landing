*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#fff,#eef3f9);color:var(--navy);font-family:var(--sans);line-height:1.65}

.logo span{font-weight:800;font-size:1.3rem;letter-spacing:.04em}
.back{color:var(--navy);font-weight:600;text-decoration:none;border-bottom:2px solid var(--gold);padding:4px 0}
main{padding:56px 0 80px}
h1{font-size:clamp(1.9rem,6vw,2.6rem);margin:0 0 12px;line-height:1.15;font-weight:800}
.rule{width:56px;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-l));margin:0 0 32px;border-radius:3px}
.ph{border:1.5px dashed var(--gold);border-radius:14px;padding:28px;background:rgba(255,255,255,.8)}
.ph strong{display:block;color:#7C5A0E}
footer{background:#00203f;padding:28px 0;color:#d3deee;font-size:.9rem}
